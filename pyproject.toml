[build-system]
requires = ["setuptools >= 67.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flico"
version = "0.1.0"
description = "Flickr commons exploration and ML analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "sqlalchemy",
    "python-dotenv",
    "flickrapi",
    "pandas",
    "scikit-learn",
    "numpy",
    "torchvision",
    "transformers",
    "Pillow",
    "requests",
    "torch>=2.0",
    "sentencepiece",
    "pgvector",
    "joblib",
    "seaborn",
    "dash",
    "plotly",
    "jupyter",
    "ipykernel",
    "openai",
    "asyncio",
    "huggingface_hub",
    "tqdm>=4.65",
    "open-clip-torch>=2.24.0",
    "opencv-python",
    "networkx",
    "lightglue @ git+https://github.com/cvg/LightGlue.git",
    "timeout-decorator",
    "pysocks",
    "mercantile",
    "vt2geojson",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false